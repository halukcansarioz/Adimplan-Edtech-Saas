services:
  redis:
    image: redis:7-alpine
    container_name: adimplan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: adimplan-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    image: python:3.11-slim
    container_name: adimplan-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: python -m http.server 8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
