<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Aradığınız Sayfa Bulunamadı | İvme Akademi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #FFFFFF;
      letter-spacing: -0.5px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
    }
    .code {
      font-size: 72px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #94A3B8;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background-color: #4F46E5;
      color: #FFFFFF;
    }
    .btn-primary:hover { background-color: #4338CA; }
    .btn-secondary {
      background-color: rgba(148, 163, 184, 0.12);
      color: #E2E8F0;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .btn-secondary:hover { background-color: rgba(148, 163, 184, 0.2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">İA</div>
    <div class="code">404</div>
    <h1>Aradığınız Sayfa Bulunamadı</h1>
    <p>Ulaşmaya çalıştığınız sayfa taşınmış, silinmiş veya adresi hatalı olabilir. Aşağıdaki bağlantılardan devam edebilirsiniz.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
      <a href="/app" class="btn btn-secondary">Panele Git</a>
    </div>
  </main>
</body>
</html>
