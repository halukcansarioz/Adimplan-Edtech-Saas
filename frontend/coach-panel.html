    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return Object.assign(structuredClone(DEFAULT_STATE), parsed);
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    let state = loadState();
    function saveState() {
      try {
        const safeCopy = structuredClone(state);
        if (safeCopy.profile) {
          delete safeCopy.profile.email;
          delete safeCopy.profile.password;
        }
        localStorage.setItem(STORE_KEY, JSON.stringify(safeCopy));
      } catch (e) {}
    }

        state.notifications.forEach(n => n.unread = false);

    function renderStudents() {

        return true;

      const riskBadge = { none: 'bg-emerald-100 text-emerald-700', medium: 'bg-amber-100 text-amber-700', risky: 'bg-rose-100 text-rose-700' };

        if (st === '-') b++;

      const net = (d - y / 4).toFixed(2);
      const opts = ['A','B','C','D','E','-'];
      return `

            <div class="flex flex-wrap items-center justify-between gap-2">
              <h3 class="font-bold text-sm">Etkileşimli Izgara Düzeltme & D/Y/B Net Hesabı</h3>

                <span class="text-emerald-600">Doğru: ${d}</span>
                <span class="text-rose-600">Yanlış: ${y}</span>
                <span class="text-slate-500">Boş: ${b}</span>

                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

                <div><b>${escapeHtml(r.studentName)}</b> (${escapeHtml(r.week)}) — ${escapeHtml(r.summary)}</div>
                <div class="flex gap-1.5">
                  ${r.status === 'pending' ? `<button data-wr-act="approve" data-id="${escapeHtml(r.id)}" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-semibold">Onayla</button>` : ''}
                  ${r.status === 'approved' ? `<button data-wr-act="send" data-id="${escapeHtml(r.id)}" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold">Gönder</button>` : ''}
                </div>
              </div>
            `).join('') || '<div class="text-xs text-slate-400">Bu sekmede rapor bulunmuyor.</div>'}
          </div>
        </div>
      `;
    }

    function renderPayments() {
      const activePkg = state.students.filter(s => (s.sessionsTotal - s.sessionsUsed) > 0).length;
      const finishedPkg = state.students.filter(s => (s.sessionsTotal - s.sessionsUsed) <= 0).length;
      const list = state.students.filter(s => {
        const rem = s.sessionsTotal - s.sessionsUsed;
        if (state.paymentFilter === 'active') return rem > 0;
        if (state.paymentFilter === 'finished') return rem <= 0;
        return true;
      });
      return `
        <div class="space-y-4">
          <h1 class="text-xl font-extrabold">Ödeme Takibi</h1>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="bg-white border rounded-2xl p-4"><div class="text-[11px] font-bold text-slate-400">TOPLAM ÖĞRENCİ</div><div class="text-2xl font-extrabold mt-1">${state.students.length}</div></div>
            <div class="bg-white border rounded-2xl p-4"><div class="text-[11px] font-bold text-emerald-600">AKTİF SEANSI OLAN</div><div class="text-2xl font-extrabold mt-1">${activePkg}</div></div>
            <div class="bg-white border rounded-2xl p-4"><div class="text-[11px] font-bold text-rose-600">SEANSI BİTMİŞ</div><div class="text-2xl font-extrabold mt-1">${finishedPkg}</div></div>
          </div>
          <div class="flex gap-2">
            ${[['all','Tümü'],['active','Aktif Seansı Olan'],['finished','Seansı Bitmiş']].map(([k, lbl]) => `
              <button data-pay-filter="${k}" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-semibold ${state.paymentFilter === k ? 'active' : 'bg-white border text-slate-700'}">${lbl}</button>
            `).join('')}
          </div>
          <div class="space-y-3">
            ${list.map(st => {
              const rem = st.sessionsTotal - st.sessionsUsed;
              return `<div class="bg-white border rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div><div class="font-bold text-sm">${escapeHtml(st.name)}</div><div class="text-slate-500">Kullanılan: ${st.sessionsUsed} / Toplam: ${st.sessionsTotal} • Kalan: <b class="${rem <= 0 ? 'text-rose-600' : 'text-emerald-600'}">${rem} Seans</b></div></div>
                <div class="flex flex-wrap gap-1.5">
                  <button data-pay-act="use" data-id="${escapeHtml(st.id)}" class="px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-700 font-semibold">— Seans Kullan (Görüşme)</button>
                  <button data-pay-act="add4" data-id="${escapeHtml(st.id)}" class="px-2.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 font-semibold">+ 4 Seans Ekle (Ödeme Geldi)</button>
                  <button data-pay-act="makeup" data-id="${escapeHtml(st.id)}" class="px-2.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 font-semibold">+ Telafi</button>
                  <button data-pay-act="manual" data-id="${escapeHtml(st.id)}" class="px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 font-semibold">— Manuel Seans</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderUpdates() {
      return `
        <div class="space-y-4">
          <h1 class="text-xl font-extrabold">Yenilikler</h1>
          <div class="space-y-3">
            ${state.updates.map(u => `
              <div class="bg-white border rounded-2xl p-4 space-y-2">
                <div class="flex items-center gap-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${u.type === 'Yeni' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">${escapeHtml(u.type)}</span><h3 class="font-bold text-sm">${escapeHtml(u.title)}</h3></div>
                <p class="text-xs text-slate-600">${escapeHtml(u.desc)}</p>
                <details class="text-xs text-slate-700 bg-slate-50 rounded-xl p-2.5"><summary class="font-semibold cursor-pointer text-indigo-700">Nasıl kullanılır?</summary><p class="mt-1.5">${escapeHtml(u.guide)}</p></details>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderProfile() {
      const p = state.profile;
      return `
        <div class="space-y-4 max-w-xl">
          <h1 class="text-xl font-extrabold">Profil</h1>
          <form id="profileForm" class="bg-white border rounded-2xl p-5 space-y-3 text-xs">
            <div><label class="font-bold block mb-1">Ad Soyad</label><input id="profName" type="text" value="${escapeHtml(p.name)}" class="w-full px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-bold block mb-1">Unvan</label><input id="profTitle" type="text" value="${escapeHtml(p.title)}" class="w-full px-3 py-2 rounded-xl border" /></div>
            <div><label class="font-bold block mb-1">Kurum</label><input id="profInst" type="text" value="${escapeHtml(p.institution)}" class="w-full px-3 py-2 rounded-xl border" /></div>
            <label class="flex items-center gap-2"><input id="profNotifSes" type="checkbox" ${p.notifySession ? 'checked' : ''} /> Görüşme bildirimleri aktif</label>
            <p class="text-[11px] text-slate-400">Güvenlik politikası gereği e-posta ve şifre bilgileri tarayıcı deposunda saklanmaz.</p>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Profili Kaydet</button>
          </form>
        </div>
      `;
    }

    function bindPageEvents() {
      const cw = document.getElementById('customizeWidgetsBtn');
      if (cw) cw.addEventListener('click', () => {
        const labels = { activity:'Aktivite Kartı', metrics:'4 Metrik', promo:'3 dk Tanıtım', calendar:'Aylık Takvim', quick:'Hızlı İşlemler', sessions:'Bugünkü Seanslar', stars:'Haftanın Yıldızları', notes:'Not Tablosu', recent:'Son Aktiviteler' };
        openModal('Ana Sayfa Widgetlarını Özelleştir', `<div class="space-y-2 text-xs">${Object.keys(labels).map(k => `<label class="flex items-center gap-2"><input type="checkbox" data-w-key="${k}" ${state.widgets[k] ? 'checked' : ''} /> ${labels[k]}</label>`).join('')}</div>`);
        document.querySelectorAll('[data-w-key]').forEach(cb => cb.addEventListener('change', () => {
          state.widgets[cb.getAttribute('data-w-key')] = cb.checked;
          saveState();
          renderAll();
        }));
      });

      const wi = document.getElementById('watchIntroBtn');
      if (wi) wi.addEventListener('click', () => openModal('3 Dakikalık Koç Paneli Tanıtımı', '<div class="text-xs text-slate-600 space-y-2"><div class="aspect-video bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold">▶ Tanıtım Videosu Önizlemesi (03:00)</div><p>Tüm modüllere sol menüden hızlıca erişebilirsiniz.</p></div>'));

      const qas = document.getElementById('quickAddSessionBtn');
      if (qas) qas.addEventListener('click', () => { state.activePage = 'meetings'; saveState(); renderAll(); });

      const qbm = document.getElementById('quickBulkMsgBtn');
      if (qbm) qbm.addEventListener('click', () => openModal('Toplu Mesaj Gönder', '<div class="space-y-2 text-xs"><textarea id="bulkMsgText" rows="3" class="w-full border rounded-xl p-2" placeholder="Tüm aktif öğrencilere mesajınız..."></textarea><button id="sendBulkBtn" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold">Gönder</button></div>'));
      const sbBtn = document.getElementById('sendBulkBtn');
      if (sbBtn) sbBtn.addEventListener('click', () => { closeModal(); alert('Toplu mesaj iletildi.'); });

      const qwr = document.getElementById('quickWeeklyReportBtn');
      if (qwr) qwr.addEventListener('click', () => { state.activePage = 'weekly-reports'; saveState(); renderAll(); });

      const an = document.getElementById('addNoteBtn');
      if (an) an.addEventListener('click', () => {
        const txt = prompt('Yeni koç notu:');
        if (txt && txt.trim()) {
          state.notes.unshift({ id: 'nt' + Date.now(), text: txt.trim(), date: new Date().toLocaleDateString('tr-TR') });
          saveState();
          renderAll();
        }
      });

      const ddp = document.getElementById('dailyDatePicker');
      if (ddp) ddp.addEventListener('change', () => { state.dailyDate = ddp.value; saveState(); renderAll(); });

      document.querySelectorAll('[data-toggle-task]').forEach(cb => cb.addEventListener('change', () => {
        const id = cb.getAttribute('data-toggle-task');
        const t = state.dailyTasks.find(x => x.id === id);
        if (t) { t.done = cb.checked; saveState(); renderAll(); }
      }));

      const amb = document.getElementById('addMeetingBtn');
      if (amb) amb.addEventListener('click', () => {
        const stName = prompt('Öğrenci adı:', 'Ayşe Yılmaz');
        const topic = prompt('Görüşme konusu:', 'Haftalık Değerlendirme');
        if (stName && topic) {
          state.sessions.unshift({ id: 'ses' + Date.now(), studentId: 's1', studentName: stName, time: '16:00', date: new Date().toISOString().slice(0,10), topic, status: 'Planlandı' });
          saveState();
          renderAll();
        }
      });

      const asb = document.getElementById('addStudentBtn');
      if (asb) asb.addEventListener('click', () => {
        const name = prompt('Öğrenci Adı Soyadı:');
        if (!name || !name.trim()) return;
        state.students.unshift({ id: 's' + Date.now(), name: name.trim(), grade: '12. Sınıf', exam: 'YKS', target: 'Hedef Belirlenecek', daysLeft: 198, progress: 50, weeklyTasksDone: 0, weeklyTasksTotal: 10, attendance: 100, risk: 'none', status: 'active', sessionsTotal: 8, sessionsUsed: 0, siteMinutes: 0, pomodoroToday: 0, pomodoroWeek: 0, pomodoroTotal: 0, schoolNotes: '-', wrongTopics: [], testLogs: [], mockExams: [], coachNotes: [], aiTasks: ['İlk deneme planlaması'], flashcards: 'Henüz hareket yok' });
        saveState();
        renderAll();
      });

      document.querySelectorAll('[data-arch]').forEach(b => b.addEventListener('click', () => { state.studentArchiveFilter = b.getAttribute('data-arch'); saveState(); renderAll(); }));
      document.querySelectorAll('[data-risk]').forEach(b => b.addEventListener('click', () => { state.studentRiskFilter = b.getAttribute('data-risk'); saveState(); renderAll(); }));
      const ssi = document.getElementById('studentSearchInput');
      if (ssi) ssi.addEventListener('input', () => { state.studentSearch = ssi.value; renderAll(); });

      document.querySelectorAll('[data-st-act]').forEach(b => b.addEventListener('click', () => {
        const act = b.getAttribute('data-st-act');
        const id = b.getAttribute('data-id');
        const st = state.students.find(x => x.id === id);
        if (!st) return;
        if (act === 'detail') { state.selectedStudentId = id; saveState(); renderAll(); }
        else if (act === 'archive') { st.status = st.status === 'active' ? 'archived' : 'active'; saveState(); renderAll(); }
        else if (act === 'msg') { alert(st.name + ' öğrencisine mesaj penceresi açıldı.'); }
        else if (act === 'task') { st.weeklyTasksTotal += 1; saveState(); renderAll(); }
        else if (act === 'report') { state.activePage = 'weekly-reports'; saveState(); renderAll(); }
      }));

      const bts = document.getElementById('backToStudentsBtn');
      if (bts) bts.addEventListener('click', () => { state.selectedStudentId = null; saveState(); renderAll(); });

      const us = document.getElementById('useSessionBtn');
      if (us) us.addEventListener('click', () => {
        const st = state.students.find(x => x.id === state.selectedStudentId);
        if (st && st.sessionsUsed < st.sessionsTotal) { st.sessionsUsed += 1; saveState(); renderAll(); }
      });
      const asp = document.getElementById('addSessionPackBtn');
      if (asp) asp.addEventListener('click', () => {
        const st = state.students.find(x => x.id === state.selectedStudentId);
        if (st) { st.sessionsTotal += 4; saveState(); renderAll(); }
      });

      document.querySelectorAll('[data-set-risk]').forEach(b => b.addEventListener('click', () => {
        const st = state.students.find(x => x.id === state.selectedStudentId);
        if (st) { st.risk = b.getAttribute('data-set-risk'); saveState(); renderAll(); }
      }));
      document.querySelectorAll('[data-detail-tab]').forEach(b => b.addEventListener('click', () => {
        state.studentDetailTab = b.getAttribute('data-detail-tab'); saveState(); renderAll();
      }));

      const ads = document.getElementById('archiveDetailStudentBtn');
      if (ads) ads.addEventListener('click', () => {
        const st = state.students.find(x => x.id === state.selectedStudentId);
        if (st) { st.status = 'archived'; state.selectedStudentId = null; saveState(); renderAll(); }
      });
      const dds = document.getElementById('deleteDetailStudentBtn');
      if (dds) dds.addEventListener('click', () => {
        state.students = state.students.filter(x => x.id !== state.selectedStudentId);
        state.selectedStudentId = null; saveState(); renderAll();
      });

      document.querySelectorAll('[data-topic-st]').forEach(b => b.addEventListener('click', () => { state.topicStudentId = b.getAttribute('data-topic-st'); saveState(); renderAll(); }));
      document.querySelectorAll('[data-topic-ex]').forEach(b => b.addEventListener('click', () => { state.topicExamGroup = b.getAttribute('data-topic-ex'); saveState(); renderAll(); }));
      document.querySelectorAll('[data-topic-idx]').forEach(cb => cb.addEventListener('change', () => {
        const idx = Number(cb.getAttribute('data-topic-idx'));
        const list = state.topicsByExam[state.topicExamGroup];
        if (list && list[idx]) { list[idx].done = cb.checked; saveState(); renderAll(); }
      }));
      const sat = document.getElementById('selectAllTopicsBtn');
      if (sat) sat.addEventListener('click', () => {
        (state.topicsByExam[state.topicExamGroup] || []).forEach(t => t.done = true);
        saveState(); renderAll();
      });
      const amt = document.getElementById('addManualTopicBtn');
      if (amt) amt.addEventListener('click', () => {
        const name = prompt('Yeni konu adı:');
        if (name && name.trim()) {
          state.topicsByExam[state.topicExamGroup].push({ name: name.trim(), done: false });
          saveState(); renderAll();
        }
      });

      document.querySelectorAll('[data-lib-tab]').forEach(b => b.addEventListener('click', () => { state.libraryTab = b.getAttribute('data-lib-tab'); saveState(); renderAll(); }));
      const alb = document.getElementById('addLibraryBookBtn');
      if (alb) alb.addEventListener('click', () => {
        const name = prompt(state.libraryTab + ' için yeni kaynak adı:');
        if (name && name.trim()) {
          if (!state.library.books[state.libraryTab]) state.library.books[state.libraryTab] = [];
          state.library.books[state.libraryTab].push(name.trim());
          saveState(); renderAll();
        }
      });

      const oki = document.getElementById('opticKeyInput');
      if (oki) oki.addEventListener('change', () => { if (oki.files[0]) { state.optic.keyFileName = oki.files[0].name; saveState(); renderAll(); } });
      const opi = document.getElementById('opticPhotoInput');
      if (opi) opi.addEventListener('change', () => { if (opi.files[0]) { state.optic.photoFileName = opi.files[0].name; saveState(); renderAll(); } });
      document.querySelectorAll('[data-optic-q]').forEach(b => b.addEventListener('click', () => {
        const q = Number(b.getAttribute('data-optic-q'));
        state.optic.studentAnswers[q] = b.getAttribute('data-optic-val');
        saveState(); renderAll();
      }));

      document.querySelectorAll('[data-gr-tab]').forEach(b => b.addEventListener('click', () => { state.generalReportTab = b.getAttribute('data-gr-tab'); saveState(); renderAll(); }));
      document.querySelectorAll('[data-wr-tab]').forEach(b => b.addEventListener('click', () => { state.weeklyReportTab = b.getAttribute('data-wr-tab'); saveState(); renderAll(); }));
      const gwn = document.getElementById('generateWeeklyNowBtn');
      if (gwn) gwn.addEventListener('click', () => {
        state.weeklyReports.unshift({ id: 'wr' + Date.now(), studentName: 'Mehmet Demir', week: '27 Kasım - 3 Aralık 2026', summary: 'Otomatik oluşturulan haftalık rapor', status: 'pending' });
        state.weeklyReportTab = 'pending'; saveState(); renderAll();
      });
      document.querySelectorAll('[data-wr-act]').forEach(b => b.addEventListener('click', () => {
        const r = state.weeklyReports.find(x => x.id === b.getAttribute('data-id'));
        if (r) { r.status = b.getAttribute('data-wr-act') === 'approve' ? 'approved' : 'sent'; saveState(); renderAll(); }
      }));

      document.querySelectorAll('[data-pay-filter]').forEach(b => b.addEventListener('click', () => { state.paymentFilter = b.getAttribute('data-pay-filter'); saveState(); renderAll(); }));
      document.querySelectorAll('[data-pay-act]').forEach(b => b.addEventListener('click', () => {
        const st = state.students.find(x => x.id === b.getAttribute('data-id'));
        const act = b.getAttribute('data-pay-act');
        if (!st) return;
        if (act === 'use' || act === 'manual') st.sessionsUsed += 1;
        else if (act === 'add4') st.sessionsTotal += 4;
        else if (act === 'makeup') st.sessionsTotal += 1;
        saveState(); renderAll();
      }));

      const pf = document.getElementById('profileForm');
      if (pf) pf.addEventListener('submit', (e) => {
        e.preventDefault();
        state.profile.name = document.getElementById('profName').value;
        state.profile.title = document.getElementById('profTitle').value;
        state.profile.institution = document.getElementById('profInst').value;
        state.profile.notifySession = document.getElementById('profNotifSes').checked;
        saveState(); renderAll();
        alert('Profil kaydedildi.');
      });
    }

    function renderAll() {
      renderSidebar();
      updateReminderUI();
      renderNotifications();
      const main = document.getElementById('mainContent');
      const map = {
        'home': renderHome,
        'weekly-program': renderWeeklyProgram,
        'daily-program': renderDailyProgram,
        'meetings': renderMeetings,
        'students': renderStudents,
        'topics': renderTopics,
        'goals': renderGoals,
        'resources': renderResources,
        'library': renderLibrary,
        'exam-analytics': renderExamAnalytics,
        'wrong-analysis': renderWrongAnalysis,
        'optic-reader': renderOpticReader,
        'general-reports': renderGeneralReports,
        'weekly-reports': renderWeeklyReports,
        'payments': renderPayments,
        'updates': renderUpdates,
        'profile': renderProfile
      };
      const fn = map[state.activePage] || renderHome;
      main.innerHTML = fn();
      bindPageEvents();
    }

    renderAll();
  </script>
<script src="./supabase-sync.js" defer></script>
</body>
</html>
