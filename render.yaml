services:
  - type: web
    name: adimplan-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://mkimvsmlxassitajminz.supabase.co
      # Publishable anahtar herkese açıktır. service_role / secret anahtar KOYMAYIN.
      # Bu iki değişken birlikte tanımlı değilse API kimlik doğrulamasız demo modunda çalışır.
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_duEqBEFX7FsPnbEq0uo9rg_osJiJp5D
      # Gizli değer: depoya yazılmaz, Render panelinden girilir. Boşsa e-posta gönderilmez (dry run).
      - key: RESEND_API_KEY
        sync: false
      # Resend'de doğrulanmış alan adına ait gönderen, ör. "Adimplan <bildirim@alanadiniz.com>"
      - key: RESEND_FROM_EMAIL
        sync: false
  - type: web
    name: adimplan-web
    runtime: static
    staticPublishPath: ./frontend
  
